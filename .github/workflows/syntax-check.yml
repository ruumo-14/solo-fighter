name: Rebuild syntax check

on:
  push:
    branches: [rebuild-v1]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript module syntax
        run: |
          for file in src/*.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done

      - name: Run core game tests
        run: npm test
